<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Portal de Proveedores Bark</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .portal-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.12); width: 100%; max-width: 400px; overflow: hidden; }
    .portal-header { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); padding: 28px 32px; text-align: center; }
    .portal-header h1 { color: #fff; font-size: 1.4rem; font-weight: 700; margin: 8px 0 4px; }
    .portal-header p { color: #93c5fd; font-size: 13px; }
    .portal-body { padding: 28px 32px 32px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; display: block; }
    .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; color: #111827; transition: border-color .2s; background: #f9fafb; }
    .form-control:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .btn-login { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn-login:hover { background: #1d4ed8; }
    .portal-footer { text-align: center; padding: 16px 32px; border-top: 1px solid #f3f4f6; background: #f9fafb; }
    .portal-footer a { color: #2563eb; text-decoration: none; font-size: 13px; }
    .alert-error { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
  </style>
</head>
<body>
<div class="portal-card">
  <div class="portal-header">
    <div style="font-size:28px;margin-bottom:4px;">🏗️</div>
    <h1>Portal de Proveedores</h1>
    <p>Maestranza Bark SPA</p>
  </div>

  <div class="portal-body">
    {% if messages %}
      {% for msg in messages %}
      <div class="alert-error">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required autofocus
               placeholder="nombre de usuario" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required
               placeholder="••••••••" autocomplete="new-password">
      </div>
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <button type="submit" class="btn-login">Ingresar al Portal</button>
    </form>
  </div>

  <div class="portal-footer">
    ¿No tienes acceso aún? <a href="{% url 'portal_registro' %}">Solicitar aquí</a>
  </div>
</div>
</body>
</html>
